services:
  - type: web
    name: veduka-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_PATH
        value: /tmp/veduka.db
      - key: ENABLE_DEMO_DATA
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true